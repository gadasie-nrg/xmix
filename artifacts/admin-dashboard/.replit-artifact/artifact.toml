kind = "web"
previewPath = "/admin-dashboard/"
title = "XmiX Admin Dashboard"
description = "A role-aware web dashboard for XmiX Super Admins and School Admins to manage schools, license seats, invite links, and teacher access."
version = "1.0.0"
id = "artifacts/admin-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/admin-dashboard/" ]
localPort = 22133

[services.development]
run = "pnpm --filter @workspace/admin-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/admin-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/admin-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22133"
BASE_PATH = "/admin-dashboard/"
